# ORNEK (uretime alinmadan once kendi alan adiniz, sertifikaniz ve aginiza gore duzenleyin). Internete aciklama/yayinlama bu depoda yapilmaz.
# Statik panel (apps/web/dist) + /api ve /agent icin API'ye ters proxy + TLS + guvenlik basliklari.
# Basliklarin TEK kaynagi deploy/security-headers.mjs'tir; scripts/deploy-config.test.mjs bu dosyanin onunla ayni oldugunu sinar.
#
# API tarafinda: TRUST_PROXY=127.0.0.1 (yalniz bu proxy'ye guvenilir), ALLOWED_ORIGINS=https://izleme.example.com, TLS_CERT/TLS_KEY GEREKMEZ
# (TLS burada sonlanir; API yalniz 127.0.0.1'de dinler). Agent (Release) yalniz HTTPS kabul eder.

server {
    listen 80;
    server_name izleme.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name izleme.example.com;

    ssl_certificate     /etc/ssl/sysmon/fullchain.pem;
    ssl_certificate_key /etc/ssl/sysmon/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    client_max_body_size 1m;   # API ingest siniri 1 MB (sikistirilmis); daha buyuk istek proxy'de kesilir

    # --- guvenlik basliklari (deploy/security-headers.mjs ile AYNI) ---
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    # --- statik panel ---
    root /var/www/sysmon/web;   # apps/web/dist icerigi
    location / {
        try_files $uri /index.html;   # SPA yedegi
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        # nginx'te add_header ust duzeyle MIRAS ALINMAZ: guvenlik basliklari burada da tekrarlanmalidir.
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    # --- API (panel) ve agent ---
    location /api/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # istemci bu basligi GONDEREMEZ: uzerine yazilir
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /api/v1/stream {   # SSE: tamponlama KAPALI, uzun okuma suresi
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    location /agent/ {
        proxy_pass http://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
